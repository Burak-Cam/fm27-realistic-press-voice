; FM27 Sesli Basın Toplantısı - ayarlar
; Bu dosyayı "settings.ini" adıyla kopyala ve düzenle (settings.ini repoya girmez).
; Boş bırakılan ayar varsayılanını kullanır. Satır başındaki ";" o satırı devre dışı bırakır.
; API ANAHTARLARINI BURAYA YAZMA: anahtarlar sadece ortam değişkeninde durur (README: Anahtarlar).

[genel]
; Football Manager 27 klasörü (Steam varsayılanı farklıysa)
;oyun_klasoru = D:\SteamLibrary\steamapps\common\Football Manager 27

; Sesli cevabı yazıya dökme: groq (Groq anahtarı gerekir; en doğru ve hızlı, ses Groq'a gider) | yerel (ses bilgisayardan çıkmaz)
;konusma_tanima = groq

; Cevap kaydını başlatıp bitiren tuş
bas_konus_tusu = f8

; Mikrofon / hoparlör: "start.bat devices" listesindeki adın bir parçası ya da numarası. Boş = Windows varsayılanı
mikrofon =
hoparlor =

[ses]
; Okuma hızı (yüzde; 0 = doğal)
okuma_hizi = 18
; Kapatılacak ses profilleri (virgülle; "start.bat voices" ile dinle)
;kapali_sesler = ahmet-genc
;moderator_sesi = ahmet

[toplanti]
; Gazetecinin takip sorusu sorma olasılığı (0-1)
takip_sorusu_olasiligi = 0.3
; Soru üretimi için en fazla bekleme (sn); aşılırsa oyunun kendi sorusu okunur
soru_sure_siniri = 9

[temizlik]
; Saklanacak en son kayıt sayısı
sakla_mac = 30
sakla_toplanti = 50

[chirp]
; İsteğe bağlı Google Chirp 3 HD sesleri için uygulama içi sınırlar (Google ücretsiz kotası aylık 1M karakter)
chirp_aylik_karakter = 500000
chirp_gunluk_karakter = 40000
